<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сонячна система</title>
    <meta name="description" content="Досліджуйте планети нашої системи.">
    <meta name="keywords" content="астрономія, сонячна система, космічні дослідження, 3D модель">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@100..900&family=Jura:wght@300..700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">

    <link rel="icon" type="image/png" sizes="32x32" href="image/favicon-32x32.png">
    <link rel="manifest" href="site.webmanifest">
    <meta name="google-site-verification" content="8155uptVXTxgn-ZIs3Hj3h_hkeIQ1hmpa6Sosza9rqM" />
</head>
<body>
    <header>
        <nav>
            <a href="index.html" class="logo-link">
                <img src="image/logo.svg" alt="Логотип Сонячна система" class="header-logo">
                <!-- ВИПРАВЛЕННЯ #6: h1 замінено на span — h2 в <main> є справжнім заголовком сторінки -->
                <span class="site-title">Сонячна<br>система</span>
            </a>
            <ul>
                <li><a href="articles.html">Статті</a></li>
                <li><a href="gallery.html">Галерея</a></li>
            </ul>
            <form action="/search" method="get" class="search-box">
                <input type="text" name="q" placeholder="Пошук..." required aria-label="Пошук по сайту">
                <button type="submit">ПОШУК</button>
            </form>
        </nav>
    </header>

    <main>
        <section class="simulation-section">
            <h2>Інтерактивна модель системи</h2>
        </section>

        <!-- ВИПРАВЛЕННЯ #7: додано role="img" та aria-label для доступності -->
        <div id="solar-canvas-container"
             role="img"
             aria-label="Інтерактивна 3D-симуляція Сонячної системи з орбітами планет">

            <div id="controls-panel">
                <div class="control-group">
                    <label for="speed-slider">Швидкість руху</label>
                    <input type="range" id="speed-slider" min="0" max="2" step="0.1" value="1">
                </div>
                <div class="control-group">
                    <label class="switch" aria-label="Увімкнути підсвічування">
                        <input type="checkbox" id="light-toggle" checked>
                        <span class="slider"></span>
                    </label>
                    <span>Підсвічування</span>
                </div>
            </div>

            <div id="camera-controls-hint">
                <span class="material-icons" aria-hidden="true">mouse</span>
                Обертання: ЛКМ | Переміщення: ПКМ | Збільшення: Коліщатко
            </div>
        </div>
    </main>

    <footer>
        <a href="about.html">Про Мене</a>
        <a href="contacts.html">Контакти</a>
        <p>&copy; 2026 Андрій</p>
    </footer>

    <!-- ВИПРАВЛЕННЯ #3: обидва скрипти three.js з одного CDN (cdnjs) для гарантованої сумісності r128 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="js/simulation.js"></script>
</body>
</html>
